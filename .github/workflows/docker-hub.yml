name: Build, Test und Deploy auf Docker Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/refcard-01

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven Tests
        run: mvn -B verify

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image bauen
        run: docker build -t $IMAGE:latest -t $IMAGE:${{ github.run_number }} .

      - name: Container testen
        run: |
          docker run -d --name refcard01 -p 8080:8080 $IMAGE:latest
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api && break
            sleep 2
          done
          curl -sf http://localhost:8080/ | grep "IP Address"
          docker rm -f refcard01

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push auf Docker Hub
        run: |
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.run_number }}
